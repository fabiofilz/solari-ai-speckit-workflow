[project]
name = "solari-workflow"
version = "0.1.0"
description = "Solari AI Spec Kit Workflow Runner"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
solari-workflow = "solari_workflow.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solari_workflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
